<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operación 99 · Aventura matemática</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#101a38}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#354e91,transparent 40%),linear-gradient(145deg,#111b3b,#19113a)}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:15px;padding:13px 17px;font-weight:800}button:focus-visible,input:focus-visible{outline:3px solid #ffe16a;outline-offset:3px}.wrap{max-width:950px;margin:auto;padding:22px 15px 70px}.hero{text-align:center;padding:18px 5px}.logo{font-size:clamp(37px,8vw,70px);font-weight:1000;letter-spacing:-2px;text-shadow:0 5px #643bc4}.subtitle{color:#d8e2ff;font-size:17px}.panel{background:#ffffff12;border:1px solid #ffffff35;border-radius:25px;padding:24px;box-shadow:0 16px 38px #0003}.btn{background:#ffdc5c;color:#24203b;box-shadow:0 5px #b98b29}.btn:hover{filter:brightness(1.07)}.secondary{background:#d5e3ff;color:#182345}.ghost{background:#ffffff1d;color:white;border:1px solid #ffffff45}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.center{text-align:center}.muted{color:#d5ddf7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}.mission{text-align:left;background:#f4f6ff;color:#19234a;padding:17px;border-radius:19px;min-height:154px;display:flex;flex-direction:column;gap:8px;border:3px solid transparent}.mission:hover{border-color:#ffd85c}.mission:disabled{opacity:.48;cursor:not-allowed}.mission .emoji{font-size:31px}.mission small{color:#58627c}.pill{display:inline-block;background:#ffffff22;border-radius:50px;padding:8px 12px}.topbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:15px}.progress{height:12px;background:#ffffff30;border-radius:20px;overflow:hidden;margin:15px 0}.fill{height:100%;background:linear-gradient(90deg,#60f1b2,#ffe06b);transition:width .3s}.question{font-size:clamp(23px,4vw,35px);font-weight:850;margin:18px 0 23px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.answer{min-height:70px;background:#f1f4ff;color:#152348;font-size:clamp(18px,3vw,25px)}.answer:hover{background:#ffe88e}.answer:disabled{opacity:.85;cursor:default}.answer.correct{background:#82e9ae}.answer.wrong{background:#ff9b9b}.feedback{padding:15px;border-radius:15px;margin:16px 0;background:#ffffff22;font-size:17px}.hidden{display:none!important}input{background:white;color:#1c2450;border:0;border-radius:12px;padding:14px;width:100%;max-width:260px;font-size:23px;text-align:center}.footer{text-align:center;margin-top:30px;color:#b7c4eb;font-size:13px}.spark{font-size:52px}.badge{background:#ffe16c;color:#352a15;padding:8px 13px;border-radius:30px;font-weight:850}.mini{font-size:14px}.big{font-size:25px}.summary{background:#ffffff16;padding:13px;border-radius:15px;margin:10px 0}.switch{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.switch button.active{background:#ffdc5c;color:#17213b}.switch button{background:#ffffff24;color:white}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:420px;margin:10px auto}.calendar span{padding:8px 2px;background:#ffffff20;border-radius:7px;text-align:center;font-size:13px}.calendar .hi{background:#ffdf6a;color:#1e2342;font-weight:900}@media(max-width:500px){.panel{padding:17px}.answers{gap:8px}.answer{min-height:65px;padding:10px}.mission{min-height:140px}.wrap{padding:12px 10px 50px}}
</style></head><body><main class="wrap"><header class="hero"><div class="logo">🚀 OPERACIÓN 99</div><div class="subtitle">¡El rescate de los números! · 8 mundos + desafío final</div></header><div id="app"></div><div class="footer">Juego educativo sin anuncios, sin cuentas y sin conexión a Internet · Tus resultados se guardan solo en este navegador.</div></main><script>
const missions=[['🧪','Laboratorio numérico','Decenas, unidades y descomposición'],['🏡','Vecinos misteriosos','Anterior y posterior'],['🐊','Cocodrilo hambriento','Mayor, menor e igual'],['🛤️','Camino secreto','Series numéricas'],['⚔️','Batalla de operaciones','Sumas y restas'],['🎯','Máquina redondeadora','Decena más próxima'],['🕵️','Detectives de operaciones','Términos de suma y resta'],['📅','Calendario encantado','Días, meses y fechas']];
const app=document.getElementById('app');let state={name:'',difficulty:1,done:[],coins:0,errors:{},mode:'home',mission:0,round:0,correct:0,questions:[],selected:false,final:false};const STORE='operacion99_v3';try{let old=JSON.parse(localStorage.getItem(STORE));if(old&&old.name)state={...state,...old,mode:'home',selected:false}}catch(e){}function save(){try{localStorage.setItem(STORE,JSON.stringify({...state,questions:[],mode:'home'}))}catch(e){}}function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}function pick(a){return a[rnd(0,a.length-1)]}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function q(prompt,answer,wrong,explain,extra={}){let options=shuffle([...new Set([String(answer),...wrong.map(String)])]);let pool=0;while(options.length<4&&pool++<30){let x=String(rnd(0,99));if(!options.includes(x))options.push(x)}return {prompt,answer:String(answer),options:shuffle(options.slice(0,4)),explain,...extra}}function num(n){return Math.max(0,Math.min(99,n))}function near(v){return Math.round(v/10)*10}function make(type,d){let max=d===0?39:d===1?79:99,a,b,c,ans,step,which;switch(type){case 0:a=rnd(10,max);which=rnd(0,3);if(which===0)return q(`¿Cuántas DECENAS tiene el número ${a}?`,Math.floor(a/10),[Math.floor(a/10)+1,a%10,Math.floor(a/10)-1],`${a} = ${Math.floor(a/10)} decenas y ${a%10} unidades.`);if(which===1)return q(`¿Cuántas UNIDADES sueltas tiene ${a}?`,a%10,[Math.floor(a/10),(a%10+1)%10,(a%10+9)%10],`${a} tiene ${Math.floor(a/10)} decenas y ${a%10} unidades.`);if(which===2)return q(`Descompón el número ${a}.`,`${Math.floor(a/10)*10} + ${a%10}`,[`${Math.floor(a/10)} + ${a%10}`,`${a%10*10} + ${Math.floor(a/10)}`,`${Math.floor(a/10)*10} + ${(a%10+1)%10}`],`Separamos decenas y unidades: ${a} = ${Math.floor(a/10)*10} + ${a%10}.`);a=rnd(1,9);b=rnd(0,9);return q(`¿Qué número forman ${a} decenas y ${b} unidades?`,a*10+b,[a+b,a*10+(b+1)%10,b*10+a],`${a} decenas son ${a*10}; sumamos ${b} unidades.`);
case 1:a=rnd(1,max-1);which=rnd(0,1);ans=which===0?a-1:a+1;return q(`¿Cuál es el número ${which===0?'ANTERIOR':'POSTERIOR'} a ${a}?`,ans,[a,which===0?a+1:a-1,num(ans+(pick([-2,2])))],`Contamos ${which===0?'uno hacia atrás':'uno hacia delante'}: ${ans}.`);
case 2:a=rnd(0,max);b=rnd(0,max);if(rnd(0,3)===0)b=a;ans=a>b?'>':a<b?'<':'=';return q(`Completa: ${a}  ❓  ${b}`,ans,['>','<','='].filter(x=>x!==ans),`${a} ${ans} ${b}. La boca del cocodrilo se abre hacia el número mayor.`,{symbols:true});
case 3:step=pick(d===0?[1,2,5,10]:d===1?[1,2,3,5,10]:[2,3,4,5,10]);which=rnd(0,1);a=which===0?rnd(0,99-step*4):rnd(step*4,99);b=which===0?step:-step;ans=a+3*b;return q(`Completa la serie: ${a}, ${a+b}, ${a+2*b}, ❓, ${a+4*b}`,ans,[num(ans+b),num(ans-b),num(ans+2*b)],`Cada paso ${b>0?'suma':'resta'} ${step}. El número que falta es ${ans}.`);
case 4:which=rnd(0,1);if(which===0){a=rnd(1,max);b=rnd(0,Math.min(max,99-a));ans=a+b;return q(`⚡ ${a} + ${b} = ?`,ans,[num(ans+1),num(ans-1),num(ans+10)],`Juntamos ${a} y ${b}: obtenemos ${ans}.`)}a=rnd(5,max);b=rnd(0,a);ans=a-b;return q(`⚡ ${a} − ${b} = ?`,ans,[num(ans+1),num(ans+2),num(ans+10)],`Quitamos ${b} a ${a}: quedan ${ans}.`);
case 5:a=rnd(10,max);if(a%10===5&&d===0)a++;ans=near(a);return q(`¿A qué DECENA está más cerca ${a}?`,ans,[num(ans-10),num(ans+10),num(a-a%10+5)],`Mira las unidades de ${a}: si son 0–4 bajamos; si son 5–9 subimos. Resultado: ${ans}.`);
case 6:which=rnd(0,5);a=rnd(10,49);b=rnd(1,Math.min(a,20));if(which===0)return q(`En ${a} + ${b} = ${a+b}, ¿cómo se llaman ${a} y ${b}?`,'Sumandos',['Minuendos','Sustraendos','Diferencias'],`Los números que se suman son los SUMANDOS.`);if(which===1)return q(`En ${a} + ${b} = ${a+b}, ¿cómo se llama ${a+b}?`,'Suma',['Diferencia','Sustraendo','Minuendo'],`El resultado de sumar se llama SUMA.`);if(which===2)return q(`En ${a} − ${b} = ${a-b}, ¿cómo se llama ${a}?`,'Minuendo',['Sustraendo','Diferencia','Sumando'],`El MINUENDO es la cantidad de la que partimos.`);if(which===3)return q(`En ${a} − ${b} = ${a-b}, ¿cómo se llama ${b}?`,'Sustraendo',['Minuendo','Diferencia','Sumando'],`El SUSTRAENDO es lo que quitamos.`);if(which===4)return q(`En ${a} − ${b} = ${a-b}, ¿cómo se llama ${a-b}?`,'Diferencia',['Suma','Minuendo','Sumando'],`El resultado de una resta es la DIFERENCIA.`);return q('¿Qué operación tiene SUMANDOS?','La suma',['La resta','Las dos','Ninguna'],'En la suma usamos sumandos; en la resta, minuendo y sustraendo.');
case 7:which=rnd(0,6);let days=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'],months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];if(which===0){a=rnd(0,6);return q(`Si hoy es ${days[a]}, ¿qué día será MAÑANA?`,days[(a+1)%7],shuffle(days.filter(x=>x!==days[(a+1)%7])).slice(0,3),'Los días de la semana siguen siempre el mismo orden.')}if(which===1){a=rnd(0,6);return q(`Si hoy es ${days[a]}, ¿qué día fue AYER?`,days[(a+6)%7],shuffle(days.filter(x=>x!==days[(a+6)%7])).slice(0,3),'Para saber ayer, retrocedemos un día.')}if(which===2)return q('¿Cuántos días tiene una semana?',7,[5,6,10],'Una semana tiene 7 días.');if(which===3)return q('¿Cuántos meses tiene un año?',12,[10,11,7],'Un año tiene 12 meses.');if(which===4){a=rnd(0,10);return q(`¿Qué mes viene DESPUÉS de ${months[a]}?`,months[a+1],shuffle(months.filter(x=>x!==months[a+1])).slice(0,3),'Los meses tienen un orden fijo.')}if(which===5){a=rnd(1,11);return q(`¿Qué mes viene ANTES de ${months[a]}?`,months[a-1],shuffle(months.filter(x=>x!==months[a-1])).slice(0,3),'Retrocedemos un mes en el calendario.')}return q('¿Qué meses tienen 30 días?','Abril, junio, septiembre y noviembre',['Enero, marzo, mayo y julio','Febrero y marzo','Todos los meses'],'Abril, junio, septiembre y noviembre tienen 30 días.');}}
function home(){state.mode='home';save();app.innerHTML=`<section class="panel center"><div class="spark">🤖✨</div><h1>¡Los números han desaparecido!</h1><p class="muted">La galaxia necesita una mente matemática. Supera 8 mundos, reúne estrellas y abre la puerta del desafío final.</p><p><label for="name">Nombre del aventurero o aventurera</label></p><input id="name" maxlength="18" placeholder="Escribe tu nombre" value="${escapeHtml(state.name)}"><h3>Elige la dificultad</h3><div class="switch" id="diff">${['🌱 Explorador','🚀 Piloto','🔥 Experto'].map((v,i)=>`<button class="${i===state.difficulty?'active':''}" data-d="${i}">${v}</button>`).join('')}</div><p class="muted mini">Puedes cambiar de nivel cuando quieras. Todas las misiones incluyen números hasta el 99, según la dificultad.</p><button class="btn big" id="start">¡A LA AVENTURA! 🚀</button>${state.done.length?'<p><button class="ghost" id="reset">Empezar desde cero</button></p>':''}</section>`;document.querySelectorAll('[data-d]').forEach(el=>el.onclick=()=>{state.difficulty=+el.dataset.d;home()});document.getElementById('start').onclick=()=>{state.name=document.getElementById('name').value.trim()||'Superestrella';save();map()};let reset=document.getElementById('reset');if(reset)reset.onclick=()=>{if(confirm('¿Borrar las estrellas y comenzar otra vez?')){state.done=[];state.coins=0;state.errors={};save();home()}}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function map(){state.mode='map';save();app.innerHTML=`<div class="topbar"><span class="pill">👩‍🚀 ${escapeHtml(state.name)}</span><span class="pill">⭐ ${state.done.length}/8 mundos</span><span class="pill">🪙 ${state.coins} monedas</span></div><section class="panel"><h2 class="center">🗺️ Mapa de la galaxia</h2><p class="center muted">Puedes repetir cualquier misión para practicar. Consigue 4 aciertos de 5 para ganar su estrella.</p><div class="grid">${missions.map((m,i)=>`<button class="mission" data-m="${i}"><span class="emoji">${m[0]} ${state.done.includes(i)?'⭐':''}</span><strong>Mundo ${i+1}: ${m[1]}</strong><small>${m[2]}</small><small>${state.done.includes(i)?'¡Superado! · Repetir':'Jugar misión'}</small></button>`).join('')}</div><div class="center" style="margin-top:20px"><button class="${state.done.length===8?'btn':'ghost'}" id="boss" ${state.done.length!==8?'disabled':''}>🏆 ${state.done.length===8?'¡DESAFÍO FINAL!':'Desafío final: desbloquea los 8 mundos'}</button><p><button class="ghost" id="home">⚙️ Cambiar dificultad</button></p></div></section>`;document.querySelectorAll('[data-m]').forEach(el=>el.onclick=()=>begin(+el.dataset.m,false));document.getElementById('boss').onclick=()=>begin(0,true);document.getElementById('home').onclick=home}
function begin(m,final){state.mission=m;state.final=final;state.round=0;state.correct=0;state.selected=false;state.questions=Array.from({length:final?12:5},(_,i)=>make(final?i%8:m,state.difficulty));state.mode='quiz';renderQ()}
function renderQ(){let item=state.questions[state.round],total=state.questions.length;app.innerHTML=`<div class="topbar"><span class="pill">${state.final?'🏆 Gran desafío':missions[state.mission][0]+' '+missions[state.mission][1]}</span><span class="pill">⭐ ${state.correct} aciertos</span><span class="pill">${state.round+1}/${total}</span></div><section class="panel center"><div class="progress"><div class="fill" style="width:${100*state.round/total}%"></div></div><div class="muted">${state.final?'¡La galaxia cuenta contigo!':'Piensa antes de elegir. ¡Tú puedes!'}</div><div class="question">${escapeHtml(item.prompt)}</div><div class="answers">${item.options.map((opt,i)=>`<button class="answer" data-a="${i}">${escapeHtml(opt)}</button>`).join('')}</div><div id="feedback" class="hidden"></div><div style="margin-top:20px"><button class="ghost" id="leave">← Volver al mapa</button></div></section>`;document.querySelectorAll('[data-a]').forEach(el=>el.onclick=()=>answer(item.options[+el.dataset.a]));document.getElementById('leave').onclick=map}
function answer(val){if(state.selected)return;state.selected=true;let item=state.questions[state.round],ok=val===item.answer;if(ok){state.correct++;state.coins+=10}else{let k=state.final?state.round%8:state.mission;state.errors[k]=(state.errors[k]||0)+1}document.querySelectorAll('[data-a]').forEach(el=>{el.disabled=true;if(el.textContent===item.answer)el.classList.add('correct');else if(el.textContent===val)el.classList.add('wrong')});let fb=document.getElementById('feedback');fb.className='feedback';fb.innerHTML=`<div class="big">${ok?'🎉 ¡CORRECTO! +10 monedas':'💡 ¡Casi! Vamos a aprenderlo.'}</div><p>${escapeHtml(item.explain)}</p><button class="btn" id="next">${state.round===state.questions.length-1?'Ver resultados 🏅':'Siguiente reto →'}</button>`;document.getElementById('next').onclick=()=>{state.round++;state.selected=false;if(state.round>=state.questions.length)finish();else renderQ()};save()}
function finish(){let total=state.questions.length,passed=state.correct>=(state.final?10:4);if(passed&&!state.final&&!state.done.includes(state.mission)){state.done.push(state.mission);state.coins+=30}if(passed&&state.final)state.coins+=100;save();let weak=Object.entries(state.errors).sort((a,b)=>b[1]-a[1]).slice(0,3);app.innerHTML=`<section class="panel center"><div class="spark">${passed?'🏆🎊':'💪🌟'}</div><h1>${passed?(state.final?'¡GALAXIA RESCATADA!':'¡MISIÓN SUPERADA!'):'¡Buen entrenamiento!'}</h1><p class="big">${state.correct} de ${total} respuestas correctas</p><p class="muted">${passed?'¡Has conseguido una estrella! Sigue explorando.':'Para superar la misión necesitas '+(state.final?'10 de 12':'4 de 5')+' aciertos. ¡Prueba otra vez!'}</p><div class="summary">🪙 Total de monedas: <b>${state.coins}</b> · ⭐ Mundos superados: <b>${state.done.length}/8</b></div>${weak.length?`<h3>🧠 Para practicar un poquito más</h3><p>${weak.map(([i])=>missions[+i][1]).join(' · ')}</p>`:''}<div class="row" style="justify-content:center"><button class="btn" id="again">🔁 Repetir reto</button><button class="secondary" id="map">🗺️ Ver mapa</button></div></section>`;document.getElementById('again').onclick=()=>begin(state.mission,state.final);document.getElementById('map').onclick=map}
home();
</script></body></html>
